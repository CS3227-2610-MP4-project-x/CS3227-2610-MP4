# Continuous integration for task 2.2.
# Requirements: openspec/changes/project-task-management/specs/continuous-integration/spec.md
# Decisions: "CI Decisions" D1-D16 in openspec/changes/project-task-management/design.md
#
# Each check is its own job so that branch protection can require it by name (D7).
# The workflow uses no repository secrets and a read-only token (D13); the build
# runs without environment variables (D12).

name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
  schedule:
    # Weekly dependency audit so new advisories surface without a code change (D6).
    # Scheduled runs execute only the dependency-audit job.
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  # Pull request runs share one group per PR and cancel the run in progress (D14).
  # Every other run (master, dev, manual, scheduled) gets a unique group, so it is
  # never cancelled or replaced while pending.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: typecheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Type-check
        run: npm run typecheck

  unit-tests:
    name: unit-tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Unit tests
        run: npm test

  build:
    name: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      # No environment variables are set for the build (D12).
      - name: Production build
        run: npm run build

  secret-scan:
    name: secret-scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned gitleaks CLI release and the SHA-256 of its linux_x64 archive, taken
      # from gitleaks_8.30.1_checksums.txt on the v8.30.1 release (D4).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"
      # Scans the full git history of the checked-out ref. Findings are redacted in
      # the log, and any finding exits non-zero, which fails this job.
      - name: Scan git history for secrets
        run: gitleaks git --redact --verbose --exit-code 1 .

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Audits the full dependency tree recorded in package-lock.json, including
      # development dependencies (D5). Fails on high or critical advisories and
      # reports lower severities without failing (D6).
      - name: Audit dependencies
        run: npm audit --audit-level=high
