name: Product website

on:
  pull_request:
    paths:
      - "product-website/**"
      - "docs/developer-guide.md"
      - "docs/user-guide.md"
      - "docs/reflections.md"
      - "docs/Lim-ZY_Reflection.md"
      - "docs/thegrimbee_Reflection.md"
      - ".github/workflows/product-website.yml"
  push:
    branches:
      - master
    paths:
      - "product-website/**"
      - "docs/developer-guide.md"
      - "docs/user-guide.md"
      - "docs/reflections.md"
      - "docs/Lim-ZY_Reflection.md"
      - "docs/thegrimbee_Reflection.md"
      - ".github/workflows/product-website.yml"

permissions:
  contents: read

concurrency:
  group: product-website-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build MarkBind site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: product-website/package-lock.json
      - name: Install MarkBind dependencies from lockfile
        run: npm ci
        working-directory: product-website
      - name: Build product website
        run: npm run build
        working-directory: product-website
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: product-website/_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
